config:
  network:
    bind_host: 0.0.0.0
    port: 14461
  soil:
    settle_frequency: 0.0001
    plant_growth_frequency: 0.001
    vertical_growth_multiple: 5.0
  colony:
    ambient_worker_count: 0
    roles:
      food_gatherer:
        lifespan: 600
        weight: 4
      hive_maintenance:
        hub:
          lifespan: 2000
          max: 1
          orbit_max_radius: 5
          plan:
            - begin_pheromone_trail: { pheromone: queen_chamber_tunnel, initial_value: 100, change_on_step: -1 }
            - move_relative: { x: 50, y: 20, dig: true }
            - move_relative: { x: 10, y: 0, dig: true }
            - set_hub_location: true
            - end_pheromone_trail: queen_chamber_tunnel
            - move_to_surface: { dig: true }
            - begin_pheromone_trail: { pheromone: entry_tunnel, initial_value: 100, change_on_step: -1 }
            - move_to_hub: { dig: true }
            - end_pheromone_trail: entry_tunnel
            - hold_at_hub: true
          weight: 1
        queen_chamber:
          lifespan: 2000
          radius_x: 19
          radius_y: 13
          weight: 1
    queen_egg_food_cost: 2
    egg_hatch_ticks: 36
    queen_delivery_radius: 5
    queen_no_fill_radius: 8
    dirt_place_cooldown_ticks: 11
    max_workers_per_hive: 30
    search_behavior_profile: outward_bias_v1
    minimum_delay_to_hatch: 5
  queen:
    egg_laying_cooldown_ticks: 5
    egg_hatch_cooldown_ticks: 50
  world:
    seed: 7
    max_depth: -255
    snapshot_interval: 5.0
    gen_params:
      chunk_width: 16
      soil:
        surface_variation: 4
        dirt_depth: 150
        dirt_variation: 3
      ore:
        attempts_per_chunk: 2
        cluster_min: 6
        cluster_max: 18
        min_depth: 20
        max_depth: 220
      food:
        attempts_per_chunk: 3
        cluster_min: 6
        cluster_max: 14
        min_depth: 0
        max_depth: 50
      stone_pockets:
        attempts_per_chunk: 2.0
        cluster_min: 1
        cluster_max: 60
        min_depth: 0
        max_depth: 235
        depth_gain: 0.00002

startup:
  paused: true
  reset_world: true
  load_gamestate:
  sc_commands:
    - /sc dig 60 60 30 20
    - /sc put queen 60 60
    - /sc set queen.eggs 1
    - /sc put stone 78 60 2 2
    - /sc dig 28 54 5 1
    - /sc dig 30 55 1 1
    - /sc dig 35 56 10 1
    - /sc dig 41 57 6 2
    - /sc dig 46 57 10 3
    - /sc put pheromone food 26 54 100
    - /sc put pheromone food 27 54 99
    - /sc put pheromone food 28 54 98
    - /sc put pheromone food 29 54 97
    - /sc put pheromone food 30 54 96
    - /sc put pheromone food 30 55 95
    - /sc put pheromone food 30 56 94
    - /sc put pheromone food 31 56 93
    - /sc put pheromone food 32 56 92
    - /sc put pheromone food 33 56 91
    - /sc put pheromone food 34 56 90
    - /sc put pheromone food 35 56 89
    - /sc put pheromone food 36 56 88
    - /sc put pheromone food 37 56 87
    - /sc put pheromone food 38 56 86
    - /sc put pheromone food 38 57 85
    - /sc put pheromone food 39 57 84
    - /sc put pheromone food 40 57 83
    - /sc put pheromone food 41 57 82
    - /sc put pheromone food 42 57 81
    - /sc put pheromone food 43 57 80
