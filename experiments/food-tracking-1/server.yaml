experiment:
  debug_log: true
  replay:
    save: true
  terminate_server_on_completion: true
  randomize_seed_from_datetime: true
  tick_millis: 1
  analysis:
    metrics:
      - simulation_length
  conditions:
    - name: baseline
      runs: 1
  stop_conditions:
    max_tick: 100
    max_day:
    all_workers_dead: true
    no_eggs: false

